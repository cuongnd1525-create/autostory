name: temp-tiktok-hook-caption
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node --check src/renderer.js
      - run: node --check electron/services/dubbingArtifactService.js
      - run: node --check electron/services/dubbingService.js
      - run: node tests/tiktokHookCaptionDefaults.test.js
      - run: node tests/ffmpegVideoDecoration.test.js
