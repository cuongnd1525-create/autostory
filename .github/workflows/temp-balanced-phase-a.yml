name: temp-balanced-phase-a
on:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node --check electron/services/manualGeminiPackService.js
      - run: node --check electron/services/manualAntigravityStage1Service.js
      - run: node --check electron/services/sourceUnderstandingMapReduce.js
      - run: |
          node - <<'NODE'
          const assert = require('assert');
          const { buildProxyChunkPlan } = require('./electron/services/manualGeminiPackService');
          const duration = 771.9;
          const scenes = Array.from({length: 87}, (_, i) => ({
            startSec: i * duration / 87,
            endSec: (i + 1) * duration / 87
          }));
          const chunks = buildProxyChunkPlan({videoDurationSec: duration, scenes});
          console.log('balanced chunks:', chunks.map(c => [c.sourceStartSec,c.sourceEndSec,c.durationSec]));
          assert(chunks.length >= 4 && chunks.length <= 5, '12.9 minute source should use about 4-5 chunks');
          assert(chunks.every(c => c.durationSec <= 210.001));
          assert.strictEqual(chunks[0].sourceStartSec, 0);
          assert(Math.abs(chunks.at(-1).sourceEndSec - duration) < 0.001);
          NODE
      - run: node tests/manualAntigravityStage1Service.test.js
      - run: node tests/sourceUnderstandingMapReduce.test.js
      - run: node tests/stage1ProcessIsolation.test.js
      - run: node tests/sourceUnderstandingCache.test.js
