name: temp-natural-manual-draft
on:
  push:
    branches: [fix/natural-manual-draft-narration]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node --check electron/services/dubbingService.js
      - run: node --check electron/services/voiceTimingPolicy.js
      - run: node --check src/renderer.js
      - run: node tests/manualDraftNarration.test.js
      - run: node tests/voiceTimingPolicy.test.js
      - run: node tests/deliveryBlocks.test.js
      - run: node tests/draftRenderCache.test.js
